[build-system]
requires = ["setuptools", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "sox_tensorflow"
version = "0.1.1"
readme = "README.md"
description = "tensorflow generation of SOX-style spectrograms on the GPU"
license = {text = "CC-BY-4.0"}
authors = [
	{name = "Brookie Guzder-Williams", email = "bguzder-williams@berkeley.edu"}
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Scientific/Engineering"
]
requires-python = ">=3.11"
dependencies = [
	"numpy >=1.26.0,<1.27",
	"soundfile >=0.13.1,<0.14",
	"soxr >=0.3.0",
]

[tool.setuptools]
packages = [
	"sox_tensorflow",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
sox_tensorflow = { path = ".", editable = true }

# Dependencies
[tool.pixi.target.linux-64.pypi-dependencies]
tensorflow = ">=2.18.0"
tf_keras = "*"

[tool.pixi.target.osx-64.pypi-dependencies]
tensorflow = ">=2.16.0,<2.17.0"
tf_keras = ">=2.16.0,<3"

[tool.pixi.target.linux-aarch64.pypi-dependencies]
tensorflow = ">=2.18.0"
tf_keras = "*"

[tool.pixi.target.osx-arm64.pypi-dependencies]
tensorflow-macos = ">=2.16.0,<2.17.0"
tensorflow-metal = ">=1.2.0,<2"
tf_keras = ">=2.16.0,<3"

[tool.pixi.dependencies]
python = ">=3.11,<3.12"

[tool.pixi.environments]
default = { features = [] }
dev = { features = ["dev"] }
test = { features = ["test"] }

[tool.pixi.feature.dev.dependencies]
twine = "*"

[tool.pixi.feature.dev.pypi-dependencies]
build = "*"
h5py = ">=3.15.1,<4"

[tool.pixi.feature.test.dependencies]
click = "*"
pillow = ">=12.1.1,<13"
boto3 = ">=1.42.71,<2"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.2.0,<8"

[dependency-groups]
test = ["pandas>=3.0.1,<4", "matplotlib>=3.10.8,<4"]
